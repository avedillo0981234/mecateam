<style>
/* Layout: app de planta — barra de pestañas en el móvil, carril lateral oscuro en escritorio; placas de código como las de las máquinas */
:root{
--bg:#EEF1F4; --surface:#FFFFFF; --sunk:#E4E9EE; --ink:#16202A; --ink-2:#4A5763; --muted:#6C7986; --line:#D5DCE3;
--hdr:#16202A; --on-hdr:#FFFFFF; --on-hdr-2:#9FB0BF;
--accent:#F5B700; --accent-ink:#16202A; --accent-soft:#FFF2C2;
--red:#C9372C; --orange:#C9661A; --green:#1B8653; --blue:#2A63CC; --violet:#7650C2; --teal:#1C8794;
--mine:#FFF2C2; --on-sem:#FFFFFF; --shadow:0 1px 2px rgba(22,32,42,.06),0 4px 14px rgba(22,32,42,.06);
--f-disp:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
--f-body:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
--f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
--r:12px; --tab:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#0E151C; --surface:#16212B; --sunk:#1D2A36; --ink:#E6ECF1; --ink-2:#B1BDC8; --muted:#8392A0; --line:#2A3846;
--hdr:#0A1015; --on-hdr:#FFFFFF; --on-hdr-2:#8FA0AF;
--accent:#F5B700; --accent-ink:#16202A; --accent-soft:#3A3010;
--red:#F2685C; --orange:#F09A52; --green:#3CC487; --blue:#78A3F2; --violet:#AC8CEA; --teal:#4CC0CD;
--mine:#3A3010; --on-sem:#0E151C; --shadow:0 1px 2px rgba(0,0,0,.3);
color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0E151C; --surface:#16212B; --sunk:#1D2A36; --ink:#E6ECF1; --ink-2:#B1BDC8; --muted:#8392A0; --line:#2A3846;
--hdr:#0A1015; --on-hdr:#FFFFFF; --on-hdr-2:#8FA0AF;
--accent:#F5B700; --accent-ink:#16202A; --accent-soft:#3A3010;
--red:#F2685C; --orange:#F09A52; --green:#3CC487; --blue:#78A3F2; --violet:#AC8CEA; --teal:#4CC0CD;
--mine:#3A3010; --on-sem:#0E151C; --shadow:0 1px 2px rgba(0,0,0,.3);
color-scheme:dark}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--hdr)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
/* Shell */
.shell{min-height:100%}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--hdr);color:var(--on-hdr);
display:flex;align-items:center;gap:8px;height:56px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.top h1{font:700 22px/1 var(--f-disp);letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib{width:40px;height:40px;border:0;background:transparent;color:var(--on-hdr);border-radius:10px;display:grid;place-items:center}
.top .ib:hover{background:rgba(255,255,255,.08)}
.top .brandmini{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.main{padding-block:16px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1120px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);
padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs button{border:0;background:transparent;height:var(--tab);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
font:600 11px/1 var(--f-body);color:var(--muted);position:relative}
.tabs button.on{color:var(--ink)}
.tabs button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tabs .cnt,.nav .cnt{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:700 11px/18px var(--f-body);text-align:center}
@media (min-width:960px){
.shell{display:grid;grid-template-columns:244px minmax(0,1fr)}
.side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--hdr);color:var(--on-hdr);padding:18px 12px;gap:4px;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side .brand b{font:700 26px/1 var(--f-disp);letter-spacing:.4px}
.side .brand small{display:block;color:var(--on-hdr-2);font-size:12px;margin-top:2px}
.nav{border:0;background:transparent;color:var(--on-hdr-2);display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-weight:600;text-align:left;position:relative}
.nav:hover{background:rgba(255,255,255,.06);color:var(--on-hdr)}
.nav.on{background:rgba(245,183,0,.14);color:var(--on-hdr)}
.nav.on svg{color:var(--accent)}
.nav .cnt{position:static;margin-left:auto}
.side .sep{height:1px;background:rgba(255,255,255,.08);margin:10px 4px}
.side .who{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:0;background:rgba(255,255,255,.05);color:var(--on-hdr);text-align:left}
.side .who small{display:block;color:var(--on-hdr-2);font-size:12px}
.tabs{display:none}
.top{background:var(--bg);color:var(--ink);height:64px;border-bottom:1px solid var(--line);padding-left:24px;padding-right:24px}
.top .ib{color:var(--ink)} .top .ib:hover{background:var(--sunk)}
.top .brandmini .logo,.top .meav{display:none}
.top h1{font-size:28px}
body::before{background:var(--bg)}
.main{padding-block:24px 80px;padding-left:28px;padding-right:28px}
}
/* Banners */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r);margin-bottom:14px;font-size:14px;
background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.banner.soft{background:var(--sunk);border-color:var(--line)}
.banner span{flex:1;min-width:200px}
/* Generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.card.tap{cursor:pointer;transition:transform .08s,border-color .15s}
.card.tap:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.card.tap:active{transform:scale(.995)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 0 10px}
.sec h2{font:700 13px/1 var(--f-body);text-transform:uppercase;letter-spacing:.7px;color:var(--ink-2)}
.sec .lnk{border:0;background:none;color:var(--blue);font-weight:600;font-size:14px;padding:4px}
.t{font-weight:600;font-size:16px;line-height:1.3}
.sub{color:var(--muted);font-size:13px}
.body{white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;color:var(--ink-2);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg.i{width:14px;height:14px;color:var(--muted)}
.badge{--c:var(--muted);display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 7px;border-radius:999px;font:600 12px/18px var(--f-body);
color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.badge.haz{color:#16202A;background:repeating-linear-gradient(-45deg,#F5B700 0 7px,#16202A 7px 14px);padding:2px 8px}
.badge.haz::before{display:none}
.badge.haz b{background:#F5B700;padding:0 5px;border-radius:4px}
.plate{background:var(--hdr);color:var(--accent);font:600 14px/1 var(--f-mono);letter-spacing:.5px;padding:9px 8px;border-radius:8px;min-width:68px;text-align:center;
box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);flex:none}
.plate.lg{font-size:18px;padding:10px 12px}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px/1 var(--f-body);flex:none;width:32px;height:32px}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty svg.i{width:40px;height:40px;stroke-width:1.5}
.empty .t{color:var(--ink-2);margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);
background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{background:var(--red);border-color:var(--red);color:#fff}
.btn.ok{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.sm{min-height:34px;padding:6px 12px;font-size:14px}
.btn.full{width:100%}
.btn[disabled]{opacity:.55;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1 1 150px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-right:-16px;padding-right:16px}
.chip{--c:var(--accent);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:7px 13px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--c);border-color:var(--c);color:var(--on-sem)}
.chip.on:not([style]){color:var(--accent-ink)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.fld>label,.lbl{font:700 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.6px;color:var(--ink-2)}
.inp{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;min-height:46px}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.hint{font-size:12px;color:var(--muted)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:13px;color:var(--muted)}
.search .inp{padding-left:40px}
.toggle{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;text-align:left}
.toggle .sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on .sw{background:var(--green)} .toggle.on .sw::after{left:21px}
.toggle.on.red .sw{background:var(--red)}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom,0px));z-index:25;
display:flex;align-items:center;gap:8px;height:54px;padding:0 20px 0 16px;border-radius:27px;border:0;background:var(--accent);color:var(--accent-ink);
font:700 15px/1 var(--f-body);box-shadow:0 6px 18px rgba(0,0,0,.25)}
@media (min-width:960px){.fab{bottom:28px;right:32px}}
.info{display:grid;grid-template-columns:auto 118px minmax(0,1fr);gap:8px;align-items:start;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line)}
.info:last-child{border-bottom:0}
.info svg.i{width:17px;height:17px;color:var(--muted);margin-top:1px}
.info .k{color:var(--muted)}
.info .v{font-weight:600;overflow-wrap:anywhere}
.lk{color:var(--blue);font-weight:600;cursor:pointer;background:none;border:0;padding:0;text-align:left}
/* Fault & machine cards */
.fault{border-left:5px solid var(--pc,var(--muted))}
.fault .top-row{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.fault .bs{display:flex;gap:6px;flex-wrap:wrap}
.mcard{display:flex;align-items:center;gap:12px}
.mcard .chev{color:var(--muted)}
/* Dashboard */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:720px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{--c:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.tile .n{font:700 40px/1 var(--f-disp);color:var(--c)}
.tile .l{font-weight:600;font-size:14px}
.tile .s{font-size:12px;color:var(--muted)}
.tile.alert{border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.tile.alert::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hello h2{font:700 32px/1.05 var(--f-disp)}
.hello .d{color:var(--muted);font-size:14px}
.hello .d::first-letter{text-transform:uppercase}
.cols{display:grid;gap:0 24px}
@media (min-width:900px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.qa .btn{min-height:52px}
.goto{display:flex;gap:8px;margin-top:10px}
.goto .inp{font-family:var(--f-mono)}
.goto .inp::placeholder{font-family:var(--f-body)}
.feed{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.feed:last-child{border-bottom:0}
.feed .dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.feed .dot svg{width:16px;height:16px}
.due{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.due:last-child{border-bottom:0}
.due .dd{font:700 20px/1 var(--f-disp);min-width:58px;text-align:right;color:var(--c)}
.due .dd small{display:block;font:500 11px/1.2 var(--f-body);color:var(--muted)}
/* Detail */
.dhead{display:flex;gap:14px;align-items:flex-start}
.dhead h2{font:700 26px/1.1 var(--f-disp);margin-top:8px}
.qr{background:#fff;padding:6px;border-radius:8px;width:112px;height:112px;flex:none;border:1px solid var(--line)}
.qr svg{display:block;width:100%;height:100%}
.qr .ph{width:100%;height:100%;display:grid;place-items:center;color:#7A8794;font-size:11px;text-align:center}
.photos{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.photos img,.photos .ph{width:120px;height:120px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--sunk);flex:none;cursor:zoom-in}
.pp{display:flex;gap:8px;flex-wrap:wrap}
.pp .th{position:relative;width:84px;height:84px}
.pp .th img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.pp .th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center}
.pp .th button svg{width:14px;height:14px}
.pp .add{width:84px;height:84px;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--muted);background:transparent;cursor:pointer}
.log{position:relative;padding-left:18px}
.log::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.log div{position:relative;padding:4px 0;font-size:14px}
.log div::before{content:"";position:absolute;left:-17px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.log small{color:var(--muted)}
/* Chat */
.chat{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.day{align-self:center;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--sunk);padding:3px 10px;border-radius:10px;margin:12px 0 6px}
.msg{display:flex;gap:8px;align-items:flex-end;margin:2px 0}
.msg.me{justify-content:flex-end}
.bub{max-width:min(80%,520px);background:var(--surface);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:8px 11px;display:flex;flex-direction:column;gap:4px}
.msg.me .bub{background:var(--mine);border-color:color-mix(in srgb,var(--accent) 40%,transparent);border-radius:14px 14px 4px 14px;cursor:pointer}
.bub .who{font-size:13px;font-weight:700;color:var(--blue)}
.bub .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.bub .tm{font-size:11px;color:var(--muted);align-self:flex-end}
.bub img{border-radius:10px;max-width:260px;width:100%;cursor:zoom-in}
.sys{align-self:center;max-width:92%;display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:7px 11px;margin:6px 0;cursor:pointer}
.sys svg.i{width:16px;height:16px;margin-top:1px}
.composer{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px));background:var(--bg);padding-top:8px;padding-bottom:10px;z-index:5}
@media (min-width:960px){.composer{bottom:0}}
.main.chatv{padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px))}
@media (min-width:960px){.main.chatv{padding-bottom:0}}
.composer .box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:5px}
.composer textarea{flex:1;border:0;background:transparent;resize:none;padding:9px 6px;max-height:140px;min-height:40px;font-size:16px;outline:none}
.composer .ib{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);display:grid;place-items:center;flex:none}
.composer .send{background:var(--accent);color:var(--accent-ink)}
.composer .send[disabled]{opacity:.45}
.delm{border:0;background:var(--red);color:#fff;border-radius:8px;font-size:12px;font-weight:700;padding:4px 8px;align-self:flex-end}
/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{font:700 11px/1 var(--f-body);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);text-align:center;padding:6px 0}
.cal button{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left}

}

else{const r=byId(c,id);if(r)Object.assign(r,data);sortCol(c);localSave();schedule()}

async function del(c,id){

VIEWS.averias=()=>{

VIEWS.chat=()=>{
if(!ready('messages','team'))return skel();
const msgs=[...S.messages].sort((a,b)=>a.createdAt-b.createdAt),me=myId();
let last='',prevAuthor=null,h='';
for(const m of msgs){

const mine=me&&m.authorId===me,show=!mine&&prevAuthor!==m.authorId;
h+=`<div class="msg ${mine?'me':''}">${!mine?`<span style="width:30px;flex:none">${show?av(nm(m.authorId),30):''}</span>`:''}

VIEWS.calendario=()=>{
if(!ready('machines','maintenances'))return skel();
const now=new Date();if(!app.cal)app.cal={y:now.getFullYear(),m:now.getMonth(),sel:sod(Date.now())};
const {y,m}=app.cal;const first=new Date(y,m,1),start=new Date(y,m,1-((first.getDay()+6)%7));
const monthEnd=new Date(y,m+1,0,23,59).getTime();
const events={};const add=(t,e)=>{const k=sod(t);(events[k]=events[k]||[]).push(e)};
const rangeStart=start.getTime(),rangeEnd=rangeStart+42*DAY;
S.machines.forEach(mc=>{if(!mc.nextDueAt)return;let t=mc.nextDueAt,k=0;
while(t<rangeEnd&&k<60){if(t>=rangeStart)add(t,{k:k?'proj':'due',m:mc,t});if(!mc.intervalDays)break;t+=mc.intervalDays*DAY;k++}});
S.maintenances.forEach(x=>{if(x.doneAt>=rangeStart&&x.doneAt<rangeEnd)add(x.doneAt,{k:'done',x})});
const today=sod(Date.now());let cells='';
for(let i=0;i<42;i++){const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const k=d.getTime();const ev=events[k]||[];
const dots=ev.slice(0,6).map(e=>e.k==='done'?`<i style="--c:var(--green)"></i>`:e.k==='proj'?`<i class="pj" style="--c:var(--orange)"></i>`:`<i style="--c:var(--${k<today?'red':'orange'})"></i>`).join('');
cells+=`<button class="${d.getMonth()!==m?'out':''} ${k===today?'today':''} ${k===app.cal.sel?'sel':''}" data-a="calSel" data-t="${k}" aria-label="${d.getDate()} de ${MESES[d.getMonth()]}"><span class="dn">${d.getDate()}</span><span class="dots">${dots}</span></button>`}
const sel=events[app.cal.sel]||[];
const overdue=S.machines.filter(x=>{const d=daysUntil(x.nextDueAt);return d!==null&&d<0}).sort((a,b)=>a.nextDueAt-b.nextDueAt);
const monthDue=S.machines.filter(x=>x.nextDueAt&&x.nextDueAt>=first.getTime()&&x.nextDueAt<=monthEnd).length;
return `${overdue.length?`<div class="card" style="border-color:color-mix(in srgb,var(--red) 45%,var(--line));margin-bottom:14px"><div class="lbl" style="color:var(--red);margin-bottom:6px">Revisiones vencidas</div>
${overdue.map(x=>`<div class="due" style="--c:var(--red)" data-a="go" data-v="maquina" data-id="${esc(x.id)}"><span class="plate">${esc(x.code)}</span><div class="grow"><div class="t" style="font-size:15px">${esc(x.name)}</div><div class="sub">Tocaba el ${fmtD(x.nextDueAt)}</div></div><span class="dd num">${-daysUntil(x.nextDueAt)}<small>días tarde</small></span></div>`).join('')}</div>`:''}
<div class="calhead"><button class="btn sm" data-a="calMove" data-v="-1" aria-label="Mes anterior">${ic('back')}</button><h2>${MESES[m]} ${y}</h2><button class="btn sm" data-a="calToday">Hoy</button><button class="btn sm" data-a="calMove" data-v="1" aria-label="Mes siguiente">${ic('chev')}</button></div>
<div class="cal">${['L','M','X','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('')}${cells}</div>
<div class="legend"><span><i style="--c:var(--orange)"></i>Revisión prevista</span><span><i class="pj" style="--c:var(--orange)"></i>Siguientes según intervalo</span><span><i style="--c:var(--red)"></i>Vencida</span><span><i style="--c:var(--green)"></i>Trabajo hecho</span><span>· ${plural(monthDue,'revisión','revisiones')} este mes</span></div>
<div class="sec"><h2>${esc(longDate(app.cal.sel))}</h2></div>
<div class="stack">${sel.length?sel.map(e=>e.k==='done'?maintCard(e.x):
`<div class="card tap mcard" data-a="go" data-v="maquina" data-id="${esc(e.m.id)}"><span class="plate">${esc(e.m.code)}</span><div class="grow"><div class="t">${esc(e.m.name)}</div><div class="sub">${e.k==='proj'?'Revisión prevista según el intervalo de '+e.m.intervalDays+' días':'Revisión programada'}${e.m.location?' · '+esc(e.m.location):''}</div></div>${badge(e.k==='proj'?'Prevista':(e.t<today?'Vencida':'Pendiente'),e.k==='proj'?'muted':(e.t<today?'red':'orange'))}</div>`).join('')
:empty('cal','Nada este día','Elige otro día del calendario.')}</div>`;
};
/* ---------- INFORMES ---------- */
VIEWS.informes=()=>{
if(!ready('machines','maintenances','faults','team'))return skel();
const days=app.rep.days,from=Date.now()-days*DAY,now=Date.now();
const ms=S.maintenances.filter(x=>x.doneAt>=from);
const fs=S.faults.filter(f=>f.createdAt>=from);
const closed=S.faults.filter(f=>f.closedAt&&f.closedAt>=from);
const mttr=closed.length?closed.reduce((s,f)=>s+(f.closedAt-f.createdAt),0)/closed.length:null;
const downBy={};let down=0;
S.faults.filter(f=>f.stopped).forEach(f=>{const a=Math.max(f.createdAt,from),b=f.closedAt||now;if(b>a){down+=b-a;downBy[f.machineId]=(downBy[f.machineId]||0)+(b-a)}});
const mins=ms.reduce((s,x)=>s+(x.durationMin||0),0);
const byType=MAINT_TYPES.map(t=>({l:t,v:ms.filter(x=>x.type===t).length,c:MT_C[t]})).filter(r=>r.v);
const byTech=S.team.map(t=>({l:t.name,v:ms.filter(x=>x.doneById===t.id).reduce((s,x)=>s+(x.durationMin||0),0),n:ms.filter(x=>x.doneById===t.id).length,c:'blue'})).filter(r=>r.n).sort((a,b)=>b.v-a.v);
const byMachF=S.machines.map(m=>({l:m.code+' · '+m.name,v:fs.filter(f=>f.machineId===m.id).length,c:'red'})).filter(r=>r.v).sort((a,b)=>b.v-a.v).slice(0,8);
const byDown=Object.entries(downBy).map(([id,v])=>({l:machineLabel(id),v:v/HOUR,c:'red'})).sort((a,b)=>b.v-a.v).slice(0,8);
const prev=ms.filter(x=>x.type==='Preventivo').length;
const withDate=S.machines.filter(m=>m.nextDueAt),onTime=withDate.filter(m=>daysUntil(m.nextDueAt)>=0);
const bars=(rows,fmt)=>{if(!rows.length)return '<div class="sub">Sin datos en este periodo.</div>';const max=Math.max(...rows.map(r=>r.v),1);
return `<div class="bars">${rows.map(r=>`<div class="bar"><span class="bl" title="${esc(r.l)}">${esc(r.l)}</span><span class="bt"><i style="width:${Math.max(2,r.v/max*100)}%;background:var(--${r.c})"></i></span><span class="bv num">${fmt(r)}</span></div>`).join('')}</div>`};
return `<div class="chips" style="margin-bottom:14px">${[[7,'7 días'],[30,'30 días'],[90,'3 meses'],[365,'12 meses']].map(([d,l])=>`<button class="chip ${days===d?'on':''}" data-a="repDays" data-v="${d}">${l}</button>`).join('')}</div>
<div class="kpis">
<div class="card kpi"><div class="n num">${ms.length}</div><div class="l">Trabajos · ${hrs(mins)} h</div></div>
<div class="card kpi"><div class="n num">${fs.length}</div><div class="l">Averías reportadas · ${plural(closed.length,'cerrada','cerradas')}</div></div>
<div class="card kpi"><div class="n num">${mttr==null?'—':(mttr/HOUR).toLocaleString('es-ES',{maximumFractionDigits:1})}<small>${mttr==null?'':'h'}</small></div><div class="l">Tiempo medio de reparación</div></div>
<div class="card kpi"><div class="n num">${(down/HOUR).toLocaleString('es-ES',{maximumFractionDigits:1})}<small>h</small></div><div class="l">Máquinas paradas (total)</div></div>
</div>
<div class="grid2" style="margin-top:12px">
<div class="card"><div class="lbl" style="margin-bottom:12px">Trabajos por tipo</div>${bars(byType,r=>r.v)}</div>
<div class="card"><div class="lbl" style="margin-bottom:12px">Horas por técnico</div>${bars(byTech,r=>hrs(r.v)+' h')}</div>
<div class="card"><div class="lbl" style="margin-bottom:12px">Averías por máquina</div>${bars(byMachF,r=>r.v)}</div>
<div class="card"><div class="lbl" style="margin-bottom:12px">Horas de parada por máquina</div>${bars(byDown,r=>r.v.toLocaleString('es-ES',{maximumFractionDigits:1})+' h')}</div>
</div>
<div class="card" style="margin-top:12px"><div class="lbl" style="margin-bottom:8px">Plan preventivo</div>
<div>${prev} preventivos en el periodo (${ms.length?Math.round(prev/ms.length*100):0} % del trabajo). ${withDate.length?`${onTime.length} de ${withDate.length} máquinas con fecha tienen la revisión al día.`:'Ninguna máquina tiene fecha de revisión todavía.'}</div></div>
<div class="sec"><h2>Exportar</h2></div>
<div class="btns"><button class="btn" data-a="csv" data-v="maintenances">${ic('download')}Mantenimientos (.csv)</button><button class="btn" data-a="csv" data-v="faults">${ic('download')}Averías (.csv)</button><button class="btn" data-a="csv" data-v="machines">${ic('download')}Máquinas (.csv)</button></div>
<p class="sub">Los CSV se abren directamente en Excel o Google Sheets e incluyen todo el historial, no solo el periodo elegido.</p>`;
};

function toast(msg,kind){let t=document.querySelector('.toast');if(!t){t=document.createElement('div');document.body.appendChild(t)}t.className='toast '+(kind||'');t.setAttribute('role','status');t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),kind==='err'?5200:2600)}

const machineUrl=id=>ART_URL+'#maq-'+id;
function qrSvg(text){
if(typeof qrcode!=='function')return null;
try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return null}
}
function hydrateQR(){document.querySelectorAll('[data-qr]').forEach(el=>{const s=qrSvg(machineUrl(el.dataset.qr));el.innerHTML=s||'<div class="ph">QR no disponible sin conexión</div>'})}
const qrStyle='@page{margin:10mm}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#111;margin:0}.grid{display:flex;flex-wrap:wrap;gap:6mm}.label{border:.6mm solid #111;border-radius:3mm;padding:4mm;page-break-inside:avoid;break-inside:avoid}.qr svg{width:100%;height:auto;display:block}.brand{font-size:8pt;letter-spacing:1pt;text-transform:uppercase;color:#555}.code{font-weight:800;font-size:20pt;font-family:"Courier New",monospace}.name{font-weight:700;font-size:12pt;margin-top:1mm}.muted{color:#555;font-size:9pt}.row{display:flex;justify-content:space-between;gap:3mm;font-size:10pt;padding:1.2mm 0;border-bottom:.3mm solid #ddd}.stripe{background:#111;color:#fff;padding:1.5mm 3mm;font-weight:800;font-size:11pt;border-radius:1.5mm;display:inline-block}.tip{font-size:10pt;color:#555;margin-bottom:6mm}@media print{.tip{display:none}}';
async function saveFile(filename,data,mime){
if(DL){try{await DL.save({filename,data});return true}catch(e){if(e&&e.code==='declined')return false;}}
// Respaldo: mostrar el contenido para copiarlo
sheet(`<h3>${esc(filename)}</h3><p>No se puede descargar desde esta vista. Copia el contenido y pégalo en un archivo nuevo.</p><textarea class="inp csv" id="fallbackTxt" readonly>${esc(typeof data==='string'?data:'')}</textarea><div class="btns" style="margin-top:10px"><button class="btn" data-a="ovCloseBtn">Cerrar</button><button class="btn pri" data-a="copyFallback">${ic('copy')}Copiar</button></div>`);
return false;
}
/* ---------- CSV ---------- */
function csvOf(col){
const q=v=>{v=v==null?'':String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
let head,rows;
if(col==='maintenances'){head=['Fecha','Código','Máquina','Tipo','Trabajo','Detalles','Recambios','Duración (min)','Técnico','Próxima revisión'];
rows=S.maintenances.map(x=>{const m=byId('machines',x.machineId);return[fmtDT(x.doneAt),m?.code,m?.name,x.type,x.title,x.description,x.parts,x.durationMin,nm(x.doneById),x.nextDueAt?fmtD(x.nextDueAt):'']})}
else if(col==='faults'){head=['Fecha','Código','Máquina','Avería','Descripción','Prioridad','Estado','Máquina parada','Reportada por','Asignada a','Cerrada','Horas abierta','Solución'];
rows=S.faults.map(f=>{const m=byId('machines',f.machineId);return[fmtDT(f.createdAt),m?.code,m?.name,f.title,f.description,f.priority,f.status,f.stopped?'Sí':'No',nm(f.createdById),f.assignedToId?nm(f.assignedToId):'',f.closedAt?fmtDT(f.closedAt):'',(((f.closedAt||Date.now())-f.createdAt)/HOUR).toFixed(1).replace('.',','),f.resolution]})}
else{head=['Código','Máquina','Ubicación','Estado','Último mantenimiento','Próxima revisión','Intervalo (días)','Notas'];
rows=S.machines.map(m=>[m.code,m.name,m.location,mState(m)[0],m.lastMaintenanceAt?fmtD(m.lastMaintenanceAt):'',m.nextDueAt?fmtD(m.nextDueAt):'',m.intervalDays||'',m.description])}
return '﻿'+[head,...rows].map(r=>r.map(q).join(';')).join('\r\n');
}
/* ---------- fotos ---------- */
function compress(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const max=1600;let {width:w,height:h}=img;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('foto')),'image/jpeg',.78)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('foto'))};img.src=u})}
async function uploadAll(list){const ids=[];for(const p of list||[]){const b=await compress(p.file);const r=await ASSETS.upload(b,{type:'image/jpeg'});ids.push(r.id)}return ids}

calToday:()=>{app.cal=null;render()},
repDays:d=>{app.rep.days=+d.v;render()},
csv:async d=>{const names={maintenances:'mantenimientos',faults:'averias',machines:'maquinas'};const day=new Date();
if(await saveFile(`mecateam-${names[d.v]}-${day.getFullYear()}${pad(day.getMonth()+1)}${pad(day.getDate())}.csv`,csvOf(d.v)))toast('Archivo descargado')},
// equipo
theme:d=>{lsSet('mecateam-theme',d.v);if(d.v==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',d.v);render()},
editMe:()=>{const m=meM();F.meName=m.name;F.meRole=m.role||'';app.editMe=true;render()},
editMeCancel:()=>{app.editMe=false;render()},
notMe:async()=>{const m=meM();lsSet('mecateam-me',null);lsSet('mecateam-skip-onboard',false);if(m&&m.uid&&m.uid===app.uid){try{await patch('team',m.id,{uid:null})}catch(e){}}render();openOnboard()},
addMember:()=>{F.addingMember=true;render();setTimeout(()=>{const n=$('#nmn');n&&n.focus()},30)},
addMemberCancel:()=>{F.addingMember=false;render()},
onboard:()=>openOnboard(),
obRole:d=>{F.obRole=d.v;const n=document.getElementById('obr');if(n)n.value=d.v;document.querySelectorAll('[data-a=obRole]').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v))},
obSkip:()=>{lsSet('mecateam-skip-onboard',true);app.fromQR=null;closeSheet()},
iam:async d=>{const t=member(d.id);if(!t)return;app.fromQR=null;lsSet('mecateam-me',t.id);lsSet('mecateam-skip-onboard',false);closeSheet();
if(app.uid&&!t.uid){try{await patch('team',t.id,{uid:app.uid})}catch(e){}}toast('Hola, '+t.name.split(' ')[0]);render()},
askDemo:()=>{const n=COLS.reduce((s,c)=>s+S[c].filter(x=>x.demo).length,0);
confirmBox('¿Borrar los datos de ejemplo?',`Se borran ${n} elementos de ejemplo (máquinas, trabajos, averías, mensajes y personas ficticias) para todo el equipo. Lo que hayáis creado vosotros se conserva.`,'Borrar ejemplos','dan',async()=>{
const meDemo=meM()?.demo;let ok=0;
for(const c of COLS){for(const x of S[c].filter(x=>x.demo)){try{await del(c,x.id);ok++}catch(e){return}}}
if(meDemo)lsSet('mecateam-me',null);toast(ok+' datos de ejemplo borrados');onboardShown=false;render()})}
};
const SUBMIT={
gotoCode:()=>A.gotoCode(),
addNote:async()=>{const f=byId('faults',cur().id);const t=(F.note||'').trim();if(!f||!t||F.busyNote||!needMe())return;stopDict();F.busyNote=true;
try{await patch('faults',f.id,{log:[...(f.log||[]),{t:Date.now(),by:myId(),x:t,note:true}].slice(-80)});F.note='';toast('Nota añadida')}catch(e){}F.busyNote=false;render()},
saveEditFault:async()=>{const f=byId('faults',cur().id);if(!f)return;const title=(F.title||'').trim();if(!title){toast('El título no puede quedar vacío.','err');return}
const data={title,description:(F.description||'').trim(),machineId:F.machineId||null};if(!data.machineId)data.stopped=false;
try{await patch('faults',f.id,{...data,log:logE(f,'Datos editados')});back();toast('Avería actualizada')}catch(e){}},
saveEditMant:async()=>{const x=byId('maintenances',cur().id);if(!x)return;const title=(F.title||'').trim();if(!title){toast('El título no puede quedar vacío.','err');return}
try{await patch('maintenances',x.id,{type:F.type,title,description:(F.description||'').trim(),parts:(F.parts||'').trim(),durationMin:Math.max(0,parseInt(F.duration,10))||null,doneById:F.by||x.doneById});back();toast('Trabajo actualizado')}catch(e){}},
saveMemberEdit:async()=>{const n=(F.emName||'').trim();if(!n||!F.emId){toast('Falta el nombre.','err');return}
try{await patch('team',F.emId,{name:n,role:(F.emRole||'').trim()});closeSheet();toast('Ficha guardada');render()}catch(e){}},
saveMachine:async()=>{const c=cur();const name=F.name.trim(),code=F.code.trim().toUpperCase();if(!name||!code){toast('El nombre y el código son obligatorios.','err');return}
if(S.machines.some(m=>m.id!==c.id&&String(m.code).toUpperCase()===code)){toast('Ya hay una máquina con el código '+code+'.','err');return}
const data={name,code,location:F.location.trim(),description:F.description.trim(),intervalDays:+F.interval||0};
try{if(c.id){const m=byId('machines',c.id);await patch('machines',c.id,data);back();toast('Máquina guardada')}
else{const id=rid();await put('machines',id,{...data,createdById:myId(),createdAt:Date.now(),lastMaintenanceAt:null,lastMaintenanceById:null,nextDueAt:null});replaceTop('maquina',{id});toast('Máquina creada')}}catch(e){}},
saveFault:async()=>{if(F.busy)return;const title=F.title.trim();if(!title){toast('Describe la avería en pocas palabras.','err');return}
F.busy=true;render();
try{const photos=await uploadAll(F.photos);const id=rid(),now=Date.now();
await put('faults',id,{title,description:F.description.trim(),machineId:F.machineId||null,priority:F.priority,stopped:!!(F.stopped&&F.machineId),status:'Abierta',photos,
createdById:myId(),createdAt:now,assignedToId:null,resolution:'',closedAt:null,closedById:null,log:[{t:now,by:myId(),x:'Reportada'+(F.stopped?' con máquina parada':'')}]});
if(F.notify){const m=byId('machines',F.machineId);await sysMsg(`ha reportado una avería ${F.priority.toLowerCase()}${F.stopped?' (máquina parada)':''}: ${title}${m?' — '+m.code+' '+m.name:''}`,'alert','averia',id)}
replaceTop('averia',{id});toast('Avería reportada')}catch(e){F.busy=false;render();if(!e||!e.code)toast('No se han podido subir las fotos. Prueba con menos o más pequeñas.','err')}},
saveMant:async()=>{if(F.busy)return;const c=cur();const m=byId('machines',F.machineId);
if(!m){toast('Elige en qué máquina se ha hecho el trabajo.','err');return}
if(!F.title.trim()){toast('Escribe un título corto, por ejemplo «Cambio de correa».','err');return}
if(!F.by){toast('Indica quién ha hecho el trabajo.','err');return}
F.busy=true;render();
try{const photos=await uploadAll(F.photos);const now=new Date();const [yy,mo,dd]=F.date.split('-').map(Number);
let doneAt=new Date(yy,mo-1,dd,12,0,0).getTime();if(sod(doneAt)===sod(now.getTime())||isNaN(doneAt))doneAt=now.getTime();if(doneAt>now.getTime())doneAt=now.getTime();
const next=+F.next?doneAt+(+F.next)*DAY:null;const id=rid();const fault=c.fid?byId('faults',c.fid):null;
await put('maintenances',id,{machineId:m.id,type:F.type,title:F.title.trim(),description:F.description.trim(),parts:F.parts.trim(),durationMin:Math.max(0,parseInt(F.duration,10))||null,
photos,doneById:F.by,doneAt,nextDueAt:next,faultId:fault?fault.id:null,createdById:myId(),createdAt:Date.now()});
if(!m.lastMaintenanceAt||m.lastMaintenanceAt<=doneAt){const upd={lastMaintenanceAt:doneAt,lastMaintenanceById:F.by};if(next||F.type==='Preventivo')upd.nextDueAt=next;await patch('machines',m.id,upd)}
if(fault&&fault.status!=='Cerrada'){await patch('faults',fault.id,{status:'Cerrada',resolution:F.description.trim()||F.title.trim(),closedAt:Date.now(),closedById:F.by,maintId:id,log:logE(fault,'Cerrada con trabajo registrado')});
await sysMsg('ha cerrado la avería «'+fault.title+'» con una reparación en '+m.code,'check','averia',fault.id)}
else if(F.notify)await sysMsg(`ha registrado un ${F.type.toLowerCase()} en ${m.code}: ${F.title.trim()}`,'wrench','mant',id);
replaceTop('mant',{id});toast('Mantenimiento guardado')}catch(e){F.busy=false;render();if(!e||!e.code)toast('No se han podido subir las fotos. Prueba con menos o más pequeñas.','err')}},
sendMsg:async()=>{const t=(F.chat||'').trim();if(!t||F.sending||!needMe())return;F.sending=true;
try{await put('messages',rid(),{kind:'user',text:t,photo:null,authorId:myId(),createdAt:Date.now()});F.chat='';chatSeen=-1}catch(e){}F.sending=false;render();const n=$('#chatIn');n&&n.focus()},
saveMe:async()=>{const m=meM();if(!F.meName.trim()){toast('Falta el nombre.','err');return}try{await patch('team',m.id,{name:F.meName.trim(),role:F.meRole.trim()});app.editMe=false;toast('Perfil guardado');render()}catch(e){}},
saveMember:async()=>{const n=(F.newName||'').trim();if(!n)return;try{await put('team',rid(),{name:n,role:(F.newRole||'').trim(),uid:null,createdAt:Date.now()});F.addingMember=false;F.newName='';F.newRole='';toast(n+' añadido al equipo');render()}catch(e){}},
obNew:async()=>{const n=(F.obName||'').trim(),r=(F.obRole||'').trim();if(!n){toast('Escribe tu nombre.','err');return}if(!r){toast('Elige o escribe tu función.','err');return}
if(S.team.some(t=>t.name.trim().toLowerCase()===n.toLowerCase()&&(!t.uid||t.uid===app.uid))){toast('Ya hay alguien llamado '+n+'. Si eres tú, elígelo en la lista.','err');return}
const id=rid();
try{await put('team',id,{name:n,role:r,uid:app.uid||null,createdAt:Date.now()});lsSet('mecateam-me',id);lsSet('mecateam-skip-onboard',false);app.fromQR=null;closeSheet();
sysMsg('se ha unido al equipo como '+r,'userplus');toast('Bienvenido/a, '+n.split(' ')[0]);render()}catch(e){}}
};
const CHANGE={
addPhotos:el=>{F.photos=F.photos||[];for(const f of el.files){if(!/^image\//.test(f.type))continue;F.photos.push({file:f,url:URL.createObjectURL(f)})}el.value='';render()},
chatPhoto:async el=>{const f=el.files[0];el.value='';if(!f||!needMe())return;toast('Enviando foto…');
try{const [id]=await uploadAll([{file:f}]);await put('messages',rid(),{kind:'user',text:(F.chat||'').trim(),photo:id,authorId:myId(),createdAt:Date.now()});F.chat='';chatSeen=-1;render()}catch(e){if(!e||!e.code)toast('No se ha podido enviar la foto.','err')}}
};
/* ---------- eventos ---------- */
document.addEventListener('click',ev=>{
const el=ev.target.closest('[data-a]');if(!el||el.tagName==='FORM')return;
const fn=A[el.dataset.a];if(!fn)return;
if(el.tagName==='BUTTON'&&el.type==='submit'&&el.form)return;
ev.preventDefault();Promise.resolve(fn(el.dataset,el,ev)).catch(e=>console.error(e));
});
document.addEventListener('submit',ev=>{const f=ev.target;if(!f.dataset.a)return;ev.preventDefault();const fn=SUBMIT[f.dataset.a];fn&&Promise.resolve(fn()).catch(e=>console.error(e))});
document.addEventListener('input',ev=>{
const el=ev.target;
if(el.dataset.f){F[el.dataset.f]=el.value;F.dirty=true;
if(el.id==='chatIn'){const b=document.querySelector('.composer .send');if(b)b.disabled=!el.value.trim();el.style.height='auto';el.style.height=Math.min(140,el.scrollHeight)+'px'}}
if(el.dataset.q!==undefined){app.q[el.dataset.q]=el.value;if(el.dataset.q!=='goto')schedule()}
});
document.addEventListener('change',ev=>{const el=ev.target;if(el.dataset.aChange&&CHANGE[el.dataset.aChange])CHANGE[el.dataset.aChange](el);if(el.tagName==='SELECT'&&el.dataset.f){F[el.dataset.f]=el.value;if(cur().v==='nuevo-mant'&&el.dataset.f==='machineId'&&F.type==='Preventivo'){const m=byId('machines',el.value);if(m&&m.intervalDays)F.next=m.intervalDays}render()}});
document.addEventListener('keydown',ev=>{
if(ev.key==='Escape'&&$('#ovl').innerHTML){closeSheet();return}
if(ev.key==='Enter'&&!ev.shiftKey&&ev.target.id==='chatIn'&&matchMedia('(pointer:fine)').matches){ev.preventDefault();SUBMIT.sendMsg()}
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(/^maq-/.test(h)){app.stack=[{v:'maquinas'},{v:'maquina',id:h.slice(4)}];app.fromQR=h.slice(4);if(!meM()&&!app.readOnly)onboardShown=false;render()}});
document.addEventListener('error',ev=>{const t=ev.target;if(t&&t.tagName==='IMG'&&t.closest('.photos,.bub')){const d=document.createElement('div');d.className='ph';d.textContent='Foto no disponible';t.replaceWith(d)}},true);
boot();
</script>
</body></html>
